<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Секретный Портал</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0b1026;
    background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #0b1026 70%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    overflow: hidden;
  }
  h1 {
    font-size: clamp(24px, 5vw, 40px);
    margin-bottom: 40px;
    text-align: center;
    background: linear-gradient(90deg, #ffd24a, #ff3d81, #7b5cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-transform: uppercase;
    letter-spacing: 3px;
    animation: pulse 3s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; transform: scale(1.02); } }

  .menu-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; }
  
  .card {
    text-decoration: none; color: #fff; width: 300px; height: 380px;
    border-radius: 30px; padding: 30px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative; overflow: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
  }
  .card:hover { transform: translateY(-15px) scale(1.02); }
  
  .card.dasha { box-shadow: 0 10px 30px rgba(255, 117, 140, 0.1); }
  .card.dasha:hover { box-shadow: 0 15px 40px rgba(255, 117, 140, 0.4); border-color: #ff758c; }
  .card.egor { box-shadow: 0 10px 30px rgba(255, 61, 129, 0.1); }
  .card.egor:hover { box-shadow: 0 15px 40px rgba(255, 61, 129, 0.4); border-color: #ff3d81; }

  .card h2 { font-size: 36px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 2px; }
  .card p { font-size: 15px; color: #ccc; text-align: center; line-height: 1.5; }
  .card .emoji { font-size: 70px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

  /* Замок */
  .lock-overlay {
    position: absolute; inset: 0; background: rgba(11, 16, 38, 0.9);
    backdrop-filter: blur(8px); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10; transition: opacity 0.4s;
  }
  .lock-overlay.hidden { opacity: 0; pointer-events: none; }
  .lock-box { text-align: center; padding: 20px; width: 100%; }
  .lock-box input {
    padding: 12px 15px; border-radius: 12px; border: 1px solid #ff3d81;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 16px;
    width: 100%; margin-bottom: 12px; text-align: center; font-family: inherit; outline: none;
  }
  .lock-box input:focus { box-shadow: 0 0 15px rgba(255,61,129,0.5); }
  .lock-box button {
    padding: 12px; border-radius: 12px; border: none; background: #ff3d81;
    color: #fff; font-size: 16px; cursor: pointer; font-weight: bold;
    width: 100%; font-family: inherit; transition: 0.2s;
  }
  .lock-box button:hover { background: #ff758c; transform: scale(1.02); }
  .error-msg { color: #ff3d81; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>

<h1>Кого будем поздравлять?</h1>

<div class="menu-container">
  <!-- ДАША (Открыта всегда) -->
  <a href="dasha.html" class="card dasha">
    <div class="emoji">💖</div>
    <h2>Даша</h2>
    <p>7 декабря<br>Самая красивая</p>
  </a>

  <!-- ЕГОР (С паролем) -->
  <a href="egor.html" class="card egor" id="egorCard" onclick="checkLock(event)">
    <div class="emoji">🩺</div>
    <h2>Егор</h2>
    <p>1 января<br>Легенда</p>
    
    <div class="lock-overlay" id="lockScreen">
      <div class="lock-box">
        <div style="font-size:50px; margin-bottom:10px;">🔒</div>
        <p style="margin-bottom:15px; font-size:13px; color:#fff;">Откроется 1 января.<br>Или введи код:</p>
        <input type="password" id="passInput" placeholder="Пароль" onclick="event.preventDefault()">
        <button onclick="unlock(event)">Открыть</button>
        <div class="error-msg" id="errMsg">Неверно!</div>
      </div>
    </div>
  </a>
</div>

<script>
  // ПАРОЛЬ (можешь поменять)
  const SECRET_PASSWORD = "brat";
  
  // Проверяем, открыт ли уже сайт
  const isUnlocked = localStorage.getItem('egor_unlocked');
  // Проверяем дату (1 января)
  const today = new Date();
  const isEgorBirthday = (today.getMonth() === 0 && today.getDate() === 1);

  if (isUnlocked === 'true' || isEgorBirthday) {
    unlockSite();
  }

  function unlockSite() {
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('egorCard').onclick = null; 
    localStorage.setItem('egor_unlocked', 'true'); 
  }

  function checkLock(e) {
    if (!document.getElementById('lockScreen').classList.contains('hidden')) {
      e.preventDefault(); 
    }
  }

  function unlock(event) {
    event.preventDefault();
    const input = document.getElementById('passInput').value;
    if (input === SECRET_PASSWORD) {
      unlockSite();
      window.location.href = "egor.html";
    } else {
      document.getElementById('errMsg').style.display = 'block';
      setTimeout(() => { document.getElementById('errMsg').style.display = 'none'; }, 2000);
    }
  }
</script>

</body>
</html>
